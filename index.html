    <script>
      // Gracefully prevent sandbox iframe WebSocket connection errors from interrupting execution
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          (e.reason.message && e.reason.message.includes('WebSocket')) ||
          (typeof e.reason === 'string' && e.reason.includes('WebSocket'))
        )) {
          e.preventDefault();
        }
      });
    </script>
